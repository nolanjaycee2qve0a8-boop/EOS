[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eos-energy-os"
version = "0.0.0"
description = "Reference implementation of the EOS Energy Decision Kernel architecture"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "EOS contributors" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<5",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "kernel",
  "capability",
  "decision_formation",
  "objective",
  "simulator",
  "ems_simulator",
  "ems_strategy",
  "edge_runtime",
  "forecast",
  "optimization",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = [
  "kernel",
  "capability",
  "decision_formation",
  "objective",
  "simulator",
  "ems_simulator",
  "ems_strategy",
  "forecast",
  "optimization",
]
